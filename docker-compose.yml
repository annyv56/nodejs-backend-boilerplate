version: "3.9"

services: 
  postgres:
    image: postgres:15
    container_name: backend-postgresql
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresAdmin@257
      POSTGRES_DB: backend_dn

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data: